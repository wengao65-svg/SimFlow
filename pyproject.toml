[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simflow"
version = "1.5.0"
description = "Portable computational simulation Skills for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["simulation", "dft", "md", "skills", "materials-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
vasp = ["pymatgen>=2023.0", "ase>=3.22", "matplotlib>=3.7"]
lammps = ["MDAnalysis>=2.5", "ase>=3.22"]
cp2k = ["ase>=3.22"]
gpumd = ["pymatgen>=2023.0"]
analysis = ["numpy>=1.26", "matplotlib>=3.7", "MDAnalysis>=2.5", "Pillow>=10"]
structure = ["pymatgen>=2023.0", "ase>=3.22"]
reference-extraction = [
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "Pillow>=10",
    "opencv-python-headless>=4.9",
    "openpyxl>=3.1",
    "h5py>=3.10",
]
all = [
    "matplotlib>=3.7",
    "pymatgen>=2023.0",
    "MDAnalysis>=2.5",
    "ase>=3.22",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "Pillow>=10",
    "opencv-python-headless>=4.9",
    "openpyxl>=3.1",
    "h5py>=3.10",
]
dev = [
    "pytest>=7.0",
    "tomli>=2.0; python_version < '3.11'",
    "pymatgen>=2023.0",
    "MDAnalysis>=2.5",
    "ase>=3.22",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
